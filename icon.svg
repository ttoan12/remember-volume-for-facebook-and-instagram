<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2"/>
      <stop offset="50%" stop-color="#C13584"/>
      <stop offset="100%" stop-color="#F77737"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Circular "remember" arrow around speaker, centered on 64,64 -->
  <g fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- ~300-degree arc, gap at top-left -->
    <path d="M64 22 A42 42 0 1 1 34.3 34.3"/>
    <!-- Chevron arrowhead: arc meets center of open end, tip points outward -->
    <polyline points="30.8,30.8 40.5,28.5 37.8,37.8"/>
  </g>

  <!-- Speaker + waves, visually centered on 64,64 -->
  <g fill="#fff">
    <!-- Speaker cone: body spans x38-62, y52-76 => centered at ~50,64 -->
    <path d="M38 52 h8 l14-12 v48 l-14-12 h-8 z"/>
    <!-- Sound wave 1 (small) -->
    <path d="M68 52 a16 16 0 0 1 0 24" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Sound wave 2 (large) -->
    <path d="M76 42 a28 28 0 0 1 0 44" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
